[project]
name = "d2-gridlayout"
version = "0.1.0"
description = "Grid placement for D2 diagrams with per-edge-kind direction rules, emitting locked TALA positions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
d2-gridlayout = "d2_gridlayout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d2_gridlayout = ["d2_graph.mjs"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
